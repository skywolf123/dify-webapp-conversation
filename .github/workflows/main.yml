name: Build and Deploy Docker Image

on:
  push:
    branches:
      - docker  # 您可以指定要触发的分支

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/dify-webapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Update server 
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker stop dify-webapp
            docker rm dify-webapp
            docker login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} https://ghcr.io 
            docker pull ghcr.io/${{ github.repository }}/dify-webapp:latest
            docker run -d -p 80:3000 --restart=always --name dify-webapp ghcr.io/${{ github.repository }}/web-image

