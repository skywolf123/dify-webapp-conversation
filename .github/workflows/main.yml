name: Build and Deploy Docker Image

on:
  push:
    branches:
      - docker  # 您可以指定要触发的分支

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}/dify-webapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Update server 
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          echo "
          #!/bin/bash
          echo 'Starting deployment...'
          docker stop dify-webapp || true
          echo 'Stopped existing container (if any).'
          
          docker rm dify-webapp || true
          echo 'Removed existing container (if any).'
          
          docker login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} https://ghcr.io 
          echo 'Logged in to GitHub Container Registry.'
      
          echo 'Pulling the latest image...'
          docker pull ghcr.io/${{ github.repository }}/dify-webapp:latest
          echo 'Image pulled successfully.'
      
          echo 'Running the container...'
          docker run -d -p 80:3000 --restart=always --name dify-webapp ghcr.io/${{ github.repository }}/dify-webapp:latest
          echo 'Container started successfully.'
          " > deploy_script.sh
      
          # 赋予脚本执行权限
          sshpass -p $SERVER_PASSWORD scp -o StrictHostKeyChecking=no deploy_script.sh $SERVER_USER@$SERVER_IP:/tmp/
          
          # 在远程服务器上后台运行脚本，重定向输出到日志文件
          sshpass -p $SERVER_PASSWORD ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "nohup bash /tmp/deploy_script.sh > /tmp/deploy.log 2>&1 &"


