name: Build and Deploy Next.js Project

on:
  push:
    branches:
      - docker  # 你可以指定要触发的分支

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用与 Dockerfile 中相同的 Node.js 版本

      - name: Install dependencies
        run: yarn install  # 使用 yarn 安装依赖

      - name: Build Next.js project
        run: yarn build  # 构建 Next.js 项目

      - name: Archive production build
        run: |
          mkdir -p build
          cp -R .next build/
          cp -R public build/
          cp package.json build/
          cp yarn.lock build/  # 如果使用 yarn，则需要复制 yarn.lock

  deploy:
    runs-on: ubuntu-latest
    needs: build  # 确保构建先完成

    steps:
      - name: Install sshpass
        run: sudo apt-get install sshpass -y

      - name: Copy files to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -r build/* $SERVER_USER@$SERVER_IP:/root/dify-webapp

      - name: SSH into server and start application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
            # Navigate to the application directory
            cd /root/dify-webapp
            
            # Install dependencies (if needed)
            yarn install --production
            
            # Start the application
            yarn start
          EOF
